<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meridian FX Pro</title>
<meta name="theme-color" content="#000000">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; }
  #topbar { height: 52px; background: #000; border-bottom: 1px solid #d4af37; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
  .logo { color: #fff; font-weight: 700; letter-spacing: 1px; }
  .logo span { color: #d4af37; }
  #account-switch button { background: #111; border: 1px solid #333; color: #888; padding: 6px 12px; font-weight: 700; font-size: 11px; }
  #account-switch button.active.demo { background: #2962ff; color: #fff; }
  #account-switch button.active.live { background: #d4af37; color: #000; }
  #main { flex: 1; overflow: hidden; position: relative; }
  .tab { display: none; height: 100%; }
  .tab.active { display: flex; flex-direction: column; }
  #chart-box, #lwchart-box { flex: 1; position: relative; }
  #tradingview_chart { height: 100%; }
  #lwchart-container { height: 100%; width: 100%; }
  #lwchart-toolbar { display: flex; gap: 6px; padding: 8px; background: #0a0a0a; border-bottom: 1px solid #222; align-items: center; }
  #lwchart-toolbar select { background: #111; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; font-size: 12px; flex: 1; }
  #lwchart-toolbar select.tf { flex: none; width: 70px; }
  #lwchart-legend { position: absolute; top: 56px; left: 8px; color: #d4af37; font-size: 12px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; z-index: 5; }
  #trade-bar { height: 64px; background: #0a0a0a; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
  .trade-btn { flex: 1; height: 44px; border: none; border-radius: 6px; font-weight: 700; }
  .trade-btn:disabled { opacity: 0.5; }
  #sell-btn, #sell-btn2 { background: #2962ff; color: #fff; }
  #buy-btn, #buy-btn2 { background: #d4af37; color: #000; }
  .vol-input { width: 60px; height: 44px; text-align: center; background: #111; color: #fff; border: 1px solid #333; }
  .panel { padding: 16px; color: #fff; overflow-y: auto; height: 100%; }
  .banner { margin-bottom: 14px; padding: 12px; background: #14110a; border: 1px solid #3a2f14; border-radius: 8px; color: #d4af37; font-size: 13px; }
  .banner.ok { background: #0a1410; border-color: #14392a; color: #4ade80; }
  .banner.err { background: #1a0a0a; border-color: #3a1414; color: #f87171; }
  button.action { display: block; width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 8px; font-weight: 700; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; }
  #pos-summary { display: flex; justify-content: space-between; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  #pos-summary .stat { text-align: center; flex: 1; }
  #pos-summary .stat .label { color: #777; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  #pos-summary .stat .value { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .pos-row { padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
  .pos-row .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
  .pos-row .bottom { display: flex; justify-content: space-between; color: #777; font-size: 11px; margin-top: 4px; }
  .side-buy { color: #d4af37; }
  .side-sell { color: #2962ff; }
  .pl-pos { color: #4ade80; }
  .pl-neg { color: #f87171; }
  #nav { height: 58px; background: #000; border-top: 1px solid #222; display: flex; }
  .navbtn { flex: 1; background: none; border: none; color: #666; font-size: 9px; }
  .navbtn.active { color: #d4af37; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">MERIDIAN <span>FX</span> PRO</div>
  <div id="account-switch">
    <button class="active demo" onclick="setAccountType('demo')">DEMO</button>
    <button class="live" onclick="setAccountType('live')">LIVE</button>
  </div>
</div>

<div id="main">
  <div id="tab-chart" class="tab active">
    <div id="chart-box"><div id="tradingview_chart"></div></div>
    <div id="trade-bar">
      <button class="trade-btn" id="sell-btn" onclick="doTrade('SELL')">SELL <span id="sell-px"></span></button>
      <input id="vol" class="vol-input" type="number" value="0.01" step="0.01">
      <button class="trade-btn" id="buy-btn" onclick="doTrade('BUY')">BUY <span id="buy-px"></span></button>
    </div>
  </div>

  <div id="tab-lwchart" class="tab">
    <div id="lwchart-toolbar">
      <select id="symbol-select" onchange="onSymbolChange()"><option>Connect first</option></select>
      <select id="tf-select" class="tf" onchange="onTimeframeChange()">
        <option value="60">1m</option>
        <option value="300">5m</option>
        <option value="900">15m</option>
        <option value="3600">1h</option>
      </select>
    </div>
    <div id="lwchart-box">
      <div id="lwchart-container"></div>
      <div id="lwchart-legend">-- --</div>
    </div>
    <div id="trade-bar">
      <button class="trade-btn" id="sell-btn2" onclick="doTrade('SELL')">SELL <span id="sell-px2"></span></button>
      <input id="vol2" class="vol-input" type="number" value="0.01" step="0.01">
      <button class="trade-btn" id="buy-btn2" onclick="doTrade('BUY')">BUY <span id="buy-px2"></span></button>
    </div>
  </div>

  <div id="tab-positions" class="tab">
    <div class="panel">
      <div id="pos-summary">
        <div class="stat"><div class="label">Open</div><div class="value" id="sum-count">0</div></div>
        <div class="stat"><div class="label">Volume</div><div class="value" id="sum-volume">0.00</div></div>
        <div class="stat"><div class="label">P/L</div><div class="value" id="sum-pl">--</div></div>
      </div>
      <div id="positions-list">No positions loaded yet.</div>
    </div>
  </div>

  <div id="tab-account" class="tab">
    <div class="panel">
      <div class="banner" id="status-text">Checking...</div>
      <button class="action" id="connect-btn" style="display:none" onclick="location.href='/login'">Connect FxPro Broker</button>
      <button class="action" id="retry-btn" style="display:none" onclick="fullConnect(true)">Retry</button>
      <div class="row"><span>Account</span><span id="acc-label">Demo</span></div>
      <div class="row"><span>Balance</span><span id="bal">--</span></div>
      <div class="row"><span>Leverage</span><span id="lev">--</span></div>
    </div>
  </div>
</div>

<div id="nav">
  <button class="navbtn active" onclick="showTab('chart')">CHART</button>
  <button class="navbtn" onclick="showTab('lwchart')">TRADE VIEW</button>
  <button class="navbtn" onclick="showTab('positions')">POSITIONS</button>
  <button class="navbtn" onclick="showTab('account')">ACCOUNT</button>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
window.onerror = function(msg, url, line, col) {
  alert('JS ERROR: ' + msg + ' (line ' + line + ')');
};

var accountType = 'demo';
var accounts = { demo: null, live: null };
var activeSymbolId = null;
var activeSymbolName = 'EURUSD';
var priceTimer = null;
var connectedType = null;
var lastBid = null;
var lastAsk = null;
var currentTab = 'chart';
var timeframeSeconds = 60;
var symbolList = [];

var lwChart = null;
var lwSeries = null;
var lwPriceLines = [];
var currentCandle = null;
var currentCandleTime = null;

new TradingView.widget({
  autosize: true, symbol: "FX:EURUSD", interval: "60", theme: "dark", style: "1",
  toolbar_bg: "#000000", container_id: "tradingview_chart",
  overrides: {
    "paneProperties.background": "#000000",
    "mainSeriesProperties.candleStyle.upColor": "#d4af37",
    "mainSeriesProperties.candleStyle.downColor": "#2962ff",
    "mainSeriesProperties.candleStyle.borderUpColor": "#d4af37",
    "mainSeriesProperties.candleStyle.borderDownColor": "#2962ff",
    "mainSeriesProperties.candleStyle.wickUpColor": "#d4af37",
    "mainSeriesProperties.candleStyle.wickDownColor": "#2962ff"
  }
});

function initLwChart() {
  var container = document.getElementById('lwchart-container');
  if (lwChart) {
    lwChart.resize(container.clientWidth, container.clientHeight);
    return;
  }
  lwChart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: { background: { color: '#000000' }, textColor: '#d4af37' },
    grid: { vertLines: { color: '#111111' }, horzLines: { color: '#111111' } },
    timeScale: { timeVisible: true, secondsVisible: true }
  });
  lwSeries = lwChart.addCandlestickSeries({
    upColor: '#d4af37', downColor: '#2962ff',
    borderUpColor: '#d4af37', borderDownColor: '#2962ff',
    wickUpColor: '#d4af37', wickDownColor: '#2962ff'
  });
  window.addEventListener('resize', function() {
    if (lwChart) lwChart.resize(container.clientWidth, container.clientHeight);
  });
}

function resetCandles() {
  currentCandle = null;
  currentCandleTime = null;
  if (lwSeries) lwSeries.setData([]);
}

async function loadHistoricalCandles() {
  var id = accounts[accountType];
  var res = await fetch("/api/trendbars/" + id + "?symbolId=" + activeSymbolId + "&period=" + timeframeSeconds).catch(function() { return null; });
  var data = await res.json();
  var candles = data.candles || [];
  if (candles.length === 0) return;
  lwSeries.setData(candles);
  var last = candles[candles.length - 1];
  currentCandle = last;
  currentCandleTime = last.time;
}

function pushLwPoint(price) {
  if (!lwSeries) return;
  var now = Math.floor(Date.now() / 1000);
  var bucketTime = now - (now % timeframeSeconds);

  if (currentCandleTime !== bucketTime) {
    currentCandleTime = bucketTime;
    currentCandle = { time: bucketTime, open: price, high: price, low: price, close: price };
  } else {
    currentCandle.high = Math.max(currentCandle.high, price);
    currentCandle.low = Math.min(currentCandle.low, price);
    currentCandle.close = price;
  }

  lwSeries.update(currentCandle);
  document.getElementById('lwchart-legend').textContent = activeSymbolName + ' ' + price.toFixed(5);
}

function updateLwPriceLines(positions) {
  if (!lwSeries) return;
  lwPriceLines.forEach(function(pl) { lwSeries.removePriceLine(pl); });
  lwPriceLines = [];
  positions.forEach(function(p) {
    var td = p.tradeData || {};
    if (String(td.symbolId) !== String(activeSymbolId)) return;
    var side = td.tradeSide === 'BUY' ? 'BUY' : 'SELL';
    var entryPrice = normalizePrice(p.price);
    if (entryPrice === null) return;
    var line = lwSeries.createPriceLine({
      price: entryPrice,
      color: side === 'BUY' ? '#d4af37' : '#2962ff',
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true,
      title: side + ' ' + (parseFloat(td.volume || 0) / 10000000).toFixed(2)
    });
    lwPriceLines.push(line);
  });
}

async function loadSymbolList() {
  var id = accounts[accountType];
  if (!id) return;
  var res = await fetch('/api/symbols/' + id).catch(function() { return null; });
  if (!res || !res.ok) return;
  var data = await res.json();
  symbolList = data.symbols || [];
  var select = document.getElementById('symbol-select');
  select.innerHTML = '';
  symbolList.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s.symbolId;
    opt.textContent = s.symbolName;
    if (String(s.symbolId) === String(activeSymbolId)) opt.selected = true;
    select.appendChild(opt);
  });
}

async function onSymbolChange() {
  var select = document.getElementById('symbol-select');
  var newSymbolId = select.value;
  var newSymbol = symbolList.find(function(s) { return String(s.symbolId) === String(newSymbolId); });
  if (!newSymbol) return;
  var id = accounts[accountType];
  if (!id) return;

  document.getElementById('lwchart-legend').textContent = 'Switching to ' + newSymbol.symbolName + '...';
  var res = await fetch('/api/switch-symbol/' + id + '?symbolId=' + newSymbolId).catch(function() { return null; });
  if (!res || !res.ok) {
    alert('Failed to switch symbol.');
    return;
  }
  activeSymbolId = newSymbolId;
  activeSymbolName = newSymbol.symbolName;
  resetCandles();

  var tvSymbol = mapToTradingViewSymbol(activeSymbolName);
  try {
    if (window.tvWidget) window.tvWidget.setSymbol(tvSymbol, timeframeSecondsToInterval(timeframeSeconds));
  } catch (e) {}
}

function mapToTradingViewSymbol(name) {
  var cryptoNames = ['BTCUSD', 'ETHUSD', 'LTCUSD', 'XRPUSD', 'BCHUSD'];
  if (cryptoNames.indexOf(name) !== -1) return 'BINANCE:' + name.replace('USD', '') + 'USDT';
  if (name.indexOf('XAU') === 0 || name.indexOf('XAG') === 0) return 'OANDA:' + name;
  return 'FX:' + name;
}

function timeframeSecondsToInterval(sec) {
  if (sec === 60) return '1';
  if (sec === 300) return '5';
  if (sec === 900) return '15';
  if (sec === 3600) return '60';
  return '60';
}

function onTimeframeChange() {
  var select = document.getElementById('tf-select');
  timeframeSeconds = parseInt(select.value, 10);
  resetCandles();
  try {
    if (window.tvWidget) window.tvWidget.setSymbol(mapToTradingViewSymbol(activeSymbolName), timeframeSecondsToInterval(timeframeSeconds));
  } catch (e) {}
}

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  if (name === 'account') {
    if (connectedType === accountType) {
      refreshBalance();
    } else {
      fullConnect(false);
    }
  }
  if (name === 'positions') loadPositions();
  if (name === 'lwchart') {
    setTimeout(function() {
      initLwChart();
      loadSymbolList();
      refreshLwPositionLines();
    }, 100);
  }
}

async function refreshLwPositionLines() {
  var id = accounts[accountType];
  if (!id || !lwSeries) return;
  var res = await fetch('/api/positions/' + id).catch(function() { return null; });
  if (!res || !res.ok) return;
  var data = await res.json();
  updateLwPriceLines(data.position || []);
}

function setAccountType(type) {
  accountType = type;
  document.querySelectorAll('#account-switch button').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('#account-switch .' + type).classList.add('active');
  document.getElementById('acc-label').textContent = type === 'demo' ? 'Demo' : 'Live';
  if (connectedType !== type) {
    fullConnect(false);
  } else {
    refreshBalance();
  }
}

async function fullConnect(forceRetry) {
  var statusEl = document.getElementById('status-text');
  var connectBtn = document.getElementById('connect-btn');
  var retryBtn = document.getElementById('retry-btn');
  statusEl.className = 'banner';
  statusEl.textContent = 'Checking connection...';
  connectBtn.style.display = 'none';
  retryBtn.style.display = 'none';

  var statusRes = await fetch('/api/status').catch(function() { return null; });
  if (!statusRes) {
    statusEl.className = 'banner err';
    statusEl.textContent = 'Cannot reach server. It may be waking up, wait 30 seconds and retry.';
    retryBtn.style.display = 'block';
    return;
  }
  var statusData = await statusRes.json();
  if (!statusData.connected) {
    statusEl.textContent = 'Not connected to FxPro yet.';
    connectBtn.style.display = 'block';
    return;
  }

  if (!accounts.demo && !accounts.live) {
    var accRes = await fetch('/api/accounts').catch(function() { return null; });
    if (!accRes || !accRes.ok) {
      statusEl.className = 'banner err';
      statusEl.textContent = 'Session expired. Please reconnect.';
      connectBtn.style.display = 'block';
      return;
    }
    var accData = await accRes.json();
    var list = accData.accounts || accData.ctidTraderAccount || [];
    list.forEach(function(a) {
      var id = a.ctidTraderAccountId || a.accountId || a.id;
      var isLive = a.isLive === true;
      if (id) accounts[isLive ? 'live' : 'demo'] = id;
    });
  }

  var id = accounts[accountType];
  if (!id) {
    statusEl.className = 'banner err';
    statusEl.textContent = 'No ' + accountType + ' account found.';
    return;
  }
  statusEl.textContent = 'Connecting to ' + accountType + ' account...';

  var res = await fetch('/api/connect/' + id + '?live=' + (accountType === 'live')).catch(function() { return null; });
  if (!res || !res.ok) {
    statusEl.className = 'banner err';
    statusEl.textContent = 'Connection failed. Try Retry.';
    retryBtn.style.display = 'block';
    return;
  }
  var data = await res.json();
  activeSymbolId = data.activeSymbolId;
  activeSymbolName = data.activeSymbolName || 'EURUSD';
  connectedType = accountType;
  resetCandles();

  if (priceTimer) clearInterval(priceTimer);
  priceTimer = setInterval(async function() {
    var r = await fetch('/api/price/' + id).catch(function() { return null; });
    if (!r) return;
    var p = await r.json();
    if (p.bid) {
      lastBid = p.bid / 100000;
      lastAsk = p.ask / 100000;
      document.getElementById('sell-px').textContent = lastBid.toFixed(5);
      document.getElementById('buy-px').textContent = lastAsk.toFixed(5);
      document.getElementById('sell-px2').textContent = lastBid.toFixed(5);
      document.getElementById('buy-px2').textContent = lastAsk.toFixed(5);
      var mid = (lastBid + lastAsk) / 2;
      pushLwPoint(mid);
      if (currentTab === 'positions') loadPositions();
    }
  }, 2000);

  statusEl.className = 'banner ok';
  statusEl.textContent = 'Connected to FxPro ' + accountType + ' account.';
  refreshBalance();
}

async function refreshBalance() {
  var id = accounts[accountType];
  if (!id) return;
  var balRes = await fetch('/api/balance/' + id).catch(function() { return null; });
  if (balRes && balRes.ok) {
    var balData = await balRes.json();
    var trader = balData.trader || balData;
    if (trader.balance !== undefined) {
      document.getElementById('bal').textContent = (trader.balance / 100).toFixed(2) + ' USD';
      document.getElementById('lev').textContent = trader.leverageInCents ? (trader.leverageInCents / 100) + 'x' : '--';
    }
  }
  var statusEl = document.getElementById('status-text');
  statusEl.className = 'banner ok';
  statusEl.textContent = 'Connected to FxPro ' + accountType + ' account.';
}

function normalizePrice(raw) {
  if (raw === undefined || raw === null) return null;
  var n = parseFloat(raw);
  if (n > 1000) return n / 100000;
  return n;
}

async function loadPositions() {
  var id = accounts[accountType];
  var listEl = document.getElementById('positions-list');
  if (!id) { listEl.textContent = 'Connect first from Account tab.'; return; }
  var res = await fetch('/api/positions/' + id).catch(function() { return null; });
  if (!res || !res.ok) { listEl.textContent = 'Could not load positions.'; return; }
  var data = await res.json();
  var positions = data.position || [];

  updateLwPriceLines(positions);

  document.getElementById('sum-count').textContent = positions.length;

  var totalVolumeLots = 0;
  var totalPL = 0;
  var havePL = lastBid !== null && lastAsk !== null;

  if (positions.length === 0) {
    listEl.innerHTML = '';
    document.getElementById('sum-volume').textContent = '0.00';
    document.getElementById('sum-pl').textContent = '--';
    var empty = document.createElement('div');
    empty.style.color = '#555';
    empty.style.fontSize = '13px';
    empty.style.padding = '20px 0';
    empty.style.textAlign = 'center';
    empty.textContent = 'No open positions.';
    listEl.appendChild(empty);
    return;
  }

  listEl.innerHTML = positions.map(function(p) {
    var td = p.tradeData || {};
    var side = td.tradeSide === 'BUY' ? 'BUY' : 'SELL';
    var sideClass = side === 'BUY' ? 'side-buy' : 'side-sell';
    var rawVolume = parseFloat(td.volume) || 0;
    var lots = rawVolume / 10000000;
    totalVolumeLots += lots;

    var entryPrice = normalizePrice(p.price);
    var plText = '--';
    var plClass = '';
    var isActiveSymbol = String(td.symbolId) === String(activeSymbolId);

    if (havePL && entryPrice !== null && lots > 0 && isActiveSymbol) {
      var units = lots * 100000;
      var pl;
      if (side === 'BUY') {
        pl = (lastBid - entryPrice) * units;
      } else {
        pl = (entryPrice - lastAsk) * units;
      }
      totalPL += pl;
      plClass = pl >= 0 ? 'pl-pos' : 'pl-neg';
      plText = (pl >= 0 ? '+' : '') + pl.toFixed(2) + ' USD';
    }

    return '<div class="pos-row">' +
      '<div class="top"><span class="' + sideClass + '">' + side + ' Symbol ' + td.symbolId + '</span><span class="' + plClass + '">' + plText + '</span></div>' +
      '<div class="bottom"><span>ID ' + p.positionId + ' &middot; ' + lots.toFixed(2) + ' lots</span>' +
      (entryPrice !== null ? '<span>Entry ' + entryPrice.toFixed(5) + '</span>' : '<span></span>') +
      '</div></div>';
  }).join('');

  document.getElementById('sum-volume').textContent = totalVolumeLots.toFixed(2) + ' lots';
  if (havePL) {
    var plSumClass = totalPL >= 0 ? 'pl-pos' : 'pl-neg';
    document.getElementById('sum-pl').innerHTML = '<span class="' + plSumClass + '">' + (totalPL >= 0 ? '+' : '') + totalPL.toFixed(2) + '</span>';
  } else {
    document.getElementById('sum-pl').textContent = '--';
  }
}

async function doTrade(side) {
  var id = accounts[accountType];
  if (!id || connectedType !== accountType) { alert('Connect first from the Account tab.'); return; }
  if (!activeSymbolId) { alert('Symbol not ready yet. Go to Account tab and wait for connection.'); return; }
  if (accountType === 'live') {
    if (!confirm('LIVE ACCOUNT - real money. Place ' + side + ' order on ' + activeSymbolName + '?')) return;
  }
  var volEl = currentTab === 'lwchart' ? document.getElementById('vol2') : document.getElementById('vol');
  var volume = parseFloat(volEl.value) || 0.01;

  document.getElementById('buy-btn').disabled = true;
  document.getElementById('sell-btn').disabled = true;
  document.getElementById('buy-btn2').disabled = true;
  document.getElementById('sell-btn2').disabled = true;

  var res = await fetch('/api/trade', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ accountId: id, symbolId: activeSymbolId, side: side, volume: volume })
  }).catch(function(e) { alert('Network error: ' + e.message); return null; });

  var reEnable = function() {
    document.getElementById('buy-btn').disabled = false;
    document.getElementById('sell-btn').disabled = false;
    document.getElementById('buy-btn2').disabled = false;
    document.getElementById('sell-btn2').disabled = false;
  };

  if (!res) { reEnable(); return; }
  var data = await res.json();
  if (!res.ok || data.error) {
    alert('Trade failed: ' + (data.error || 'unknown error'));
    reEnable();
    return;
  }

  var execution = null;
  for (var i = 0; i < 8; i++) {
    await new Promise(function(r) { setTimeout(r, 700); });
    var er = await fetch('/api/last-execution/' + id).catch(function() { return null; });
    if (er) {
      var ed = await er.json();
      if (ed && Object.keys(ed).length > 0) { execution = ed; break; }
    }
  }

  if (!execution) {
    alert('Order sent, but no confirmation arrived in 6 seconds. Check Positions tab manually.');
  } else if (execution.error) {
    alert('Order REJECTED by FxPro: ' + (execution.description || JSON.stringify(execution)));
  } else {
    alert(side + ' order filled on ' + activeSymbolName + '.');
  }

  reEnable();
  loadPositions();
}

fullConnect(false);
</script>

</body>
</html>
